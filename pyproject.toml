[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiro-ust"
version = "0.5.0"
description = "Procedural Japanese lyric to UTAU UST generator"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ilya Minin (Eli)" }]
dependencies = [
  "numpy>=1.26.0",
  "PyYAML>=6.0",
  "PySide6>=6.8,<7",
  "SudachiPy>=0.6.11,<0.7",
  "sudachidict_small==20250515",
]

[project.scripts]
hiro-ust = "hiro_ust.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = { find = { where = ["src"] } }
include-package-data = true
